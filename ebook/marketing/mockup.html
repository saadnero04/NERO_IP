<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#070908}
.stage{width:1080px;height:1350px;position:relative;overflow:hidden;
 background:radial-gradient(ellipse at 60% 30%,#2a2f22 0%,#0f1310 45%,#050605 100%);perspective:2200px;font-family:Inter,Arial,sans-serif}
.desk{position:absolute;left:0;right:0;bottom:0;height:462px;background:linear-gradient(#21190e,#0b0806);border-top:1px solid #3a2c15}
.glow{position:absolute;left:300px;top:250px;width:600px;height:700px;background:radial-gradient(#e8b93155,transparent 65%);filter:blur(20px)}
.book{position:absolute;left:300px;top:150px;width:520px;height:735px;transform-style:preserve-3d;transform:rotateY(-24deg) rotateX(4deg)}
.front{position:absolute;inset:0;background:url(cover.png) center/cover;border-radius:2px 6px 6px 2px;
 box-shadow:inset 6px 0 10px rgba(255,255,255,.12), inset -2px 0 4px rgba(0,0,0,.6)}
.front:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,255,255,.18) 0%,transparent 30%,transparent 70%,rgba(255,255,255,.06) 100%);border-radius:inherit}
.spine{position:absolute;left:0;top:0;width:46px;height:100%;background:linear-gradient(90deg,#050605,#16201a 60%,#0b0e0c);
 transform:rotateY(-90deg);transform-origin:left;display:flex;align-items:center;justify-content:center}
.spine span{writing-mode:vertical-rl;transform:rotate(180deg);color:#e8b931;font-weight:800;letter-spacing:.25em;font-size:15px}
.pages{position:absolute;right:0;top:4px;width:44px;height:727px;background:repeating-linear-gradient(90deg,#efe9dc,#efe9dc 2px,#d8d0bf 3px);
 transform:rotateY(90deg) translateZ(0);transform-origin:right}
.shadow{position:absolute;left:250px;top:862px;width:640px;height:60px;background:radial-gradient(rgba(0,0,0,.85),transparent 70%);filter:blur(8px)}
.mug{position:absolute;right:70px;bottom:300px;width:130px;height:150px;border-radius:0 0 26px 26px;background:linear-gradient(90deg,#111,#2b2b2b,#111)}
.mug:before{content:"";position:absolute;top:0;left:6px;right:6px;height:22px;border-radius:50%;background:radial-gradient(#8a5a2b,#4a2c12)}
.plant{position:absolute;left:60px;bottom:330px;width:120px;height:180px}
.plant i{position:absolute;bottom:40px;width:28px;height:120px;border-radius:50%;background:#1f3a22}
.price{position:absolute;right:70px;top:90px;background:#e8b931;color:#1b1600;font-weight:900;font-size:30px;padding:14px 24px;border-radius:10px;transform:rotate(6deg)}
.refl{position:absolute;left:300px;top:888px;width:520px;height:300px;background:url(cover.png) center bottom/520px 735px;transform:scaleY(-1) skewX(8deg);opacity:.12;
 -webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.9),transparent 45%)}
.cap{position:absolute;left:0;right:0;bottom:90px;text-align:center;color:#f0ece0;font-size:40px;line-height:1.35}
.cap b{color:#e8b931}
</style></head><body><div class="stage">
<div class="glow"></div><div class="desk"></div>
<div class="shadow"></div>
<div class="book"><div class="spine"><span>THE AI SIDE INCOME PLAYBOOK</span></div><div class="front"></div><div class="pages"></div></div>
<div class="price">65 PAGES + WORKBOOK</div>
<div class="refl"></div><div class="cap">The 30-day plan to your first AI client.<br><b>Comment "AI" to get it.</b></div>
</div></body></html>
